# Serves the built SPA inside the `web` container (as a non-root user, on 8080). TLS and
# the security headers are applied by the edge Caddy in front of it (root Caddyfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed file names never change, so cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}

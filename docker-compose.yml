# Development stack: `make dev` (foreground) or `make up` (background, waits until healthy).
# Only Caddy is published, on 127.0.0.1:8080. Postgres and Redis stay on the internal
# network (guide 12.7). Production uses docker-compose.prod.yml (Phase 9).
name: winnow

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  environment:
    # Development mail always goes to Mailpit (http://localhost:8025), whatever .env says.
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_TLS: none
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    # `make local` runs without ClamAV and sets this empty: uploads are then kept unscanned,
    # and the app says so (guide 16.2).
    CLAMAV_HOST: ${CLAMAV_HOST-clamav}
  volumes:
    - ./backend:/app
    - uploads:/data/uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    # Docker's default 64 MB of /dev/shm is too little for PostgreSQL's parallel workers:
    # VACUUM of the records table failed with "could not resize shared memory segment".
    shm_size: 256mb
    # PostgreSQL's stock settings, adjusted for an SSD and bulk imports: room between
    # checkpoints, SSD costs, and a modest cache (512 MB of shared buffers got the database
    # OOM-killed on a 4 GB Docker VM that also runs ClamAV, the worker and Vite).
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-winnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winnow}
      POSTGRES_DB: ${POSTGRES_DB:-winnow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email in development: open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Scans every uploaded PDF before anyone can open it (guide 12.4). The first start
  # downloads the signature database (a few hundred MB, a few minutes); a volume keeps it.
  # About 1.2 GB of memory; `make local` leaves it out. The Debian image because the
  # Alpine one is not built for arm64 (Apple silicon).
  clamav:
    image: clamav/clamav-debian:1.4
    profiles: ["scan"]
    environment:
      # PDFs up to MAX_PDF_MB (100 by default) are streamed to clamd whole.
      CLAMD_CONF_StreamMaxLength: 100M
      # Reloading new signatures beside the old ones would double the memory it needs.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  # One-shot: brings the database to the latest migration before the API starts.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=2).status != 200)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings", "--watch", "app"]
    # Background work yields the CPU to people waiting on the API: a 100,000-record
    # retrain is minutes of CPU, and at the default weight it slowed decisions (p95 154 ms
    # at the Phase 9 audit). The worker still uses every core nobody else wants.
    cpu_shares: 256
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # The worker's own heartbeat: arq refreshes this key while it runs and lets it
      # expire when it stops. (`arq --check` imports all of Winnow first, which takes
      # longer than the timeout on a busy machine.)
      test:
        - CMD
        - python
        - -c
        - "import os, sys, redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).exists('arq:queue:health-check') else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      # Keep the image's Linux node_modules; never mix in the host's.
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    environment:
      CSP_SCRIPT_SRC: "'self' 'unsafe-inline'"
    ports:
      - "127.0.0.1:${WINNOW_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # Guide 13's load test, only with `make load` (the "load" profile): k6 reaches the app
  # through Caddy, with the sessions benchmarks/load_setup.py prepared.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    volumes:
      - ./load:/scripts:ro
      - ./backend/benchmarks/data:/load:ro
    command: ["run", "/scripts/decide.js"]

volumes:
  clamav:
  uploads:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
